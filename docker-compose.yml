version: "3.8"

services:
  pkg_sender:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pkg_sender
    restart: unless-stopped

    environment:
      PORT: "3333"
      STATIC_FILES: "/app/files"
      LOCALIP: "192.168.0.104"
      PS4IP: "192.168.0.102"

    volumes:
      - /srv/PS4Unified:/app/files

    ports:
      - "3333:3333"

    networks:
      - ps4net

networks:
  ps4net:
    driver: bridge