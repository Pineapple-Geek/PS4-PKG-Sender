version: "3.8"

services:
  ps4pkg:
    image: justanormaldev/ps4-pkg-sender:latest
    container_name: ps4-pkg-sender
    restart: unless-stopped

    environment:
      PORT: "3333"
      STATIC_FILES: "/app/files"
      LOCALIP: "192.168.0.104"
      PS4IP: "192.168.0.102"

    volumes:
      - /srv/PS4Fusion:/app/files

    ports:
      - "3333:3333"

    networks:
      - ps4net

networks:
  ps4net:
    driver: bridge
